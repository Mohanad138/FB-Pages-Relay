name: Facebook Relay

on:
  repository_dispatch:
    types: [run-bot]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fb-relay
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID_1: ${{ secrets.FB_PAGE_ID_1 }}
          FB_PAGE_TOKEN_1: ${{ secrets.FB_PAGE_TOKEN_1 }}
          IG_USER_ID_1: ${{ secrets.IG_USER_ID_1 }}
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase origin main
          git push
